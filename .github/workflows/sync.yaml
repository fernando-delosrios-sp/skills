name: Sync Skills

# Scheduled sync disabled — overlays are applied locally.
# Use workflow_dispatch to run a manual sync check if needed.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Dry-run sync check
        run: npm run sync -- --dry-run

      - name: Validate
        run: npm run validate
