skill: improve-codebase-architecture
description: Markdown report, OpenSpec change after grill, dual-mode domain model

changes:
  - action: remove
    file: HTML-REPORT.md
  - action: add
    file: LANGUAGE.md
    from: files/LANGUAGE.md
  - action: add
    file: MARKDOWN-REPORT.md
    from: files/MARKDOWN-REPORT.md
  - action: add
    file: OPENSPEC-CHANGE.md
    from: files/OPENSPEC-CHANGE.md

  - file: SKILL.md
    instructions: |
      Adapt improve-codebase-architecture for dual-mode domain modeling, markdown reports, and OpenSpec change output:

      1. **Mode detection first:** Before domain-model guidance, check whether `openspec/config.yaml` or `openspec/specs/` exists. Same detection as `/domain-modeling`.

      2. **Architecture vocabulary:** Use [LANGUAGE.md](LANGUAGE.md) for module/interface/depth/seam vocabulary. Do not route vocabulary through `/codebase-design`.

      3. **OpenSpec mode:**
         - Do NOT reference or write `CONTEXT.md`, `CONTEXT-MAP.md`, or `docs/adr/`.
         - Read ubiquitous-language spec and relevant capability specs for seams and settled decisions.
         - During grilling, run `/domain-modeling` for domain-model side effects.
         - Spec conflicts only when friction warrants reopening.

      4. **Legacy mode:**
         - Read `CONTEXT.md` (or via `CONTEXT-MAP.md`) and `docs/adr/`.
         - During grilling, run `/domain-modeling` for CONTEXT/ADR side effects.

      5. **Report format:** Markdown in chat per [MARKDOWN-REPORT.md](MARKDOWN-REPORT.md). Optional save to `ARCHITECTURE-REVIEW.md`. No HTML/CDN/browser.

      6. **Grilling loop:** `/grilling` + `/domain-modeling`; optional `/codebase-design` design-it-twice. After user confirms shared understanding:
         - **OpenSpec mode:** Write `openspec/changes/<slug>/` for the picked candidate per [OPENSPEC-CHANGE.md](OPENSPEC-CHANGE.md). `discovery.md` = grill decisions; `design.md` = deepening shape; `tasks.md` = apply plan. Do not implement. Hand off: `/opsx:apply <slug>` or **apply-code-changes**.
         - **Legacy mode:** Stop after grill — no change folder.

      Preserve upstream process (YAGNI scoping, hot-spot inference, explore subagent, deletion test, recommendation badges, pick-one flow).

  - file: MARKDOWN-REPORT.md
    instructions: |
      Make report format OpenSpec-aware alongside legacy:

      - **Suggested context:** terms to formalise via `/domain-modeling` — OpenSpec → ubiquitous-language (+ capability specs when relevant); legacy → CONTEXT.md.
      - **Decision conflict:** OpenSpec → capability spec slug/requirement blockquote; legacy → ADR identifier.
      - Do not create CONTEXT.md or ADRs from the report — route through domain-modeling.
      - Optional note after report (OpenSpec only): picked candidates can become change packages after grilling.
