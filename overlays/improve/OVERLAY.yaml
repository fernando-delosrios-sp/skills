skill: improve
description: OpenSpec-aware intent doc ingestion and decision conflict handling

changes:
  - file: SKILL.md
    instructions: |
      Adapt improve for dual-mode intent/design doc ingestion (OpenSpec vs legacy):

      1. **Mode detection first:** Before intent-doc guidance in Phase 1 Recon, check whether `openspec/config.yaml` or `openspec/specs/` exists in the target repo. Branch all subsequent intent/design doc behavior on this — same detection as `/domain-modeling`.

      2. **OpenSpec mode** (when detected):
         - Do NOT reference or rely on `CONTEXT.md`, `CONTEXT-MAP.md`, `docs/adr/`, PRDs, `PRODUCT.md`, or `DESIGN.md` as intent sources — capability specs under `openspec/specs/` are the canonical record for product, design, and architectural intent.
         - Read `openspec/specs/ubiquitous-language/spec.md` for domain vocabulary that plans and findings should honor.
         - Scan relevant capability specs under `openspec/specs/` for product, design, and architectural decisions this audit should not re-litigate.
         - Treat settled capability spec requirements as by-design — same role ADRs and legacy product/design docs play in legacy mode.
         - When vetting findings, a candidate that contradicts an existing spec requirement is only worth surfacing when friction warrants reopening — mark as spec conflict, not ADR.
         - Plans should cite capability spec slugs/requirements (not ADR identifiers or legacy doc paths) when documenting constraints the executor must honor.
         - **Introducing product or design changes:** when a finding or plan would create or update product/design intent (new features, roadmap items, design-system constraints), do NOT write PRDs, `PRODUCT.md`, or `DESIGN.md`. Route through the OpenSpec change workflow — delta specs under `openspec/changes/<name>/specs/<capability>/spec.md`, with `/opsx:propose` or `/domain-modeling` for side effects (same pattern as `/codebase-design` grilling). Direction and spike plans may include an explicit prerequisite step to open or land the change proposal before implementation.
         - README roadmaps may still be read as informal signal when no equivalent capability spec exists; prefer capability specs when both are present.

      3. **Legacy mode** (no OpenSpec):
         - Preserve upstream behavior: glob for ADRs (`docs/adr/`, `docs/adrs/`, `docs/decisions/`), `CONTEXT.md`, `DESIGN.md`, `PRODUCT.md`, PRDs/specs.
         - ADR and CONTEXT.md tradeoffs remain the by-design signal during vet and planning.

      4. **Cross-skill:** When OpenSpec is absent and the user needs to initialize it, suggest the `openspec-init` skill. Reference `/domain-modeling` and [OPENSPEC-MODE.md](../domain-modeling/OPENSPEC-MODE.md) for how terms and decisions are recorded in OpenSpec repos.

      5. **Subagent prompts:** In Phase 2, pass mode-appropriate settled-decision hints to subagents (capability spec slugs in OpenSpec mode; ADR identifiers in legacy mode).

      6. **Frontmatter:** Extend description to mention OpenSpec-aware intent ingestion when capability specs exist.

      Preserve upstream hard rules, workflow phases, invocation variants, and tone.

  - file: references/audit-playbook.md
    instructions: |
      Make audit playbook OpenSpec-aware alongside legacy:

      - In Security "By-design" bullet: dual-mode settled decisions — OpenSpec capability spec requirements are settled like ADRs; stale spec drift (code contradicts spec) is itself a finding.
      - In Direction "Stated-but-undelivered": in OpenSpec mode, capability specs are the strongest grounding signal (not PRDs or `PRODUCT.md`); in legacy mode, PRDs and `PRODUCT.md` apply. Never propose something a spec or decision doc already rejected.
      - Direction plans that introduce new product or design intent: in OpenSpec mode, scope as spike/change-proposal plans routed through `/opsx:propose` or `/domain-modeling` — do not instruct creating PRDs, `PRODUCT.md`, or `DESIGN.md`; in legacy mode, design/spike plans may reference those docs.
      - Do not instruct agents to create CONTEXT.md, ADRs, PRDs, `PRODUCT.md`, `DESIGN.md`, or capability specs directly from audit findings — route vocabulary/decision/product updates through `/domain-modeling` or the OpenSpec change workflow.

  - file: references/plan-template.md
    instructions: |
      Make plan template OpenSpec-aware alongside legacy:

      - In "Current state" vocabulary bullet: dual-mode — OpenSpec → cite relevant ubiquitous-language terms and capability spec requirements (slug + requirement name), including product/design constraints encoded in specs; legacy → `CONTEXT.md` terms, ADR identifiers, and `DESIGN.md` tokens/components to reuse. Executor must not be told to read OpenSpec paths the advisor did not actually find.
      - Add optional **OpenSpec prerequisite** section for direction/spike plans in OpenSpec repos: when implementation depends on new product or design intent, list the change proposal step (`/opsx:propose` or `/domain-modeling`) before code steps — do not add steps that create PRDs, `PRODUCT.md`, or `DESIGN.md`.
