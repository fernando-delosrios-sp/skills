skill: improve
description: OpenSpec change packages wrap execution plans; dual-mode intent ingestion

changes:
  - action: add
    file: references/openspec-change.md
    from: files/openspec-change.md

  - file: SKILL.md
    instructions: |
      Adapt improve for dual-mode output (OpenSpec change packages vs legacy plans) and intent ingestion:

      1. **Mode detection first:** Before intent-doc guidance in Phase 1 Recon, check whether `openspec/config.yaml` or `openspec/specs/` exists in the target repo. Branch all subsequent behavior on this — same detection as `/domain-modeling`.

      2. **Hard Rules — allowed writes:**
         - **Legacy mode:** `plans/` (or `advisor-plans/` when `plans/` exists for another purpose) only.
         - **OpenSpec mode:** `openspec/changes/<slug>/` only — never `plans/` on the same run.
         - Never modify source code in either mode.

      3. **OpenSpec mode — intent:**
         - Do NOT use `CONTEXT.md`, `CONTEXT-MAP.md`, `docs/adr/`, PRDs, `PRODUCT.md`, or `DESIGN.md` as intent sources.
         - Read `openspec/specs/ubiquitous-language/spec.md` and scan relevant capability specs for settled decisions.
         - Treat settled spec requirements as by-design; spec conflicts only when friction warrants reopening.
         - Findings and change packages cite capability slugs/requirements, not ADR paths.
         - README roadmaps as informal signal when no equivalent spec exists.

      4. **OpenSpec mode — Phase 4 (replace upstream "Write the plans"):**
         - Read [references/openspec-change.md](references/openspec-change.md) before writing the first package.
         - For **each selected finding**, write one `openspec/changes/<slug>/` folder per that reference — all artifacts for the target schema (ferspec table in the reference).
         - Map plan-template sections into the change package; do **not** write `plans/NNN-*.md`.
         - Write **Apply status** at the end of each `proposal.md` (Status, Depends on slugs, Issue). Report the same table in chat. No `plans/README.md`.
         - Non-interactive default selection: record it in those Apply status blocks, not chat-only.
         - Reconcile against existing non-archive changes; monotonic slugs; skip duplicates.

      5. **Legacy mode:**
         - Preserve upstream Phase 4: `plans/` + plan-template + `plans/README.md`.
         - Glob ADRs, CONTEXT.md, PRDs, etc. for intent; ADR/CONTEXT tradeoffs are by-design.

      6. **Invocation variants — OpenSpec remaps** (legacy unchanged):
         - `plan <description>` → one change folder.
         - `review-plan <path>` → critique `tasks.md` + specs in that change.
         - `execute <slug>` → invoke **apply-code-changes** on the change folder; advisor reviews, never edits source.
         - `reconcile` / `--issues` → operate on open changes per openspec-change.md.

      7. **Cross-skill:** OpenSpec absent → suggest `openspec-init`. Reference `/domain-modeling` and [OPENSPEC-MODE.md](../domain-modeling/OPENSPEC-MODE.md).

      8. **Subagent prompts:** Pass mode-appropriate settled-decision hints (capability slugs vs ADR ids).

      9. **Frontmatter:** Description mentions OpenSpec change packages when capability specs exist. Keep `disable-model-invocation: true`.

      Preserve upstream hard rules (no source edits, no secrets, read-only recon), Phases 1–3, effort levels, tone.

  - file: references/audit-playbook.md
    instructions: |
      Make audit playbook OpenSpec-aware alongside legacy:

      - Security "By-design": OpenSpec capability requirements are settled like ADRs; stale spec drift is a finding.
      - Direction "Stated-but-undelivered": OpenSpec → capability specs strongest signal; legacy → PRDs/`PRODUCT.md`. Never propose what a spec rejected.
      - Direction selected findings: **OpenSpec mode** → change packages with spike-scoped `tasks.md` (not PRDs/`PRODUCT.md`); **legacy** → design/spike plans may reference those docs.
      - Do not instruct creating CONTEXT.md, ADRs, PRDs, capability specs, or `PRODUCT.md`/`DESIGN.md` from findings — vocabulary/decisions route through `/domain-modeling` or the change package itself.

  - file: references/plan-template.md
    instructions: |
      Dual-mode plan template:

      - **Legacy mode:** Preserve full template and `plans/NNN-slug.md` output path.
      - **OpenSpec mode:** This file is the **section map**, not the output path. Do not write standalone plan files. Map sections into `openspec/changes/<slug>/` per [openspec-change.md](./openspec-change.md). Status / Depends on / Issue map to `proposal.md` **Apply status**. Remove or omit the **OpenSpec prerequisite** section — the change package is the proposal.
      - "Current state" vocabulary bullet: OpenSpec → ubiquitous-language + capability requirements; legacy → CONTEXT.md, ADR ids, DESIGN.md tokens. Cite only paths the advisor actually found.

  - file: references/closing-the-loop.md
    instructions: |
      Dual-mode closing the loop:

      - **Legacy mode:** Preserve upstream execute/reconcile/--issues against `plans/` unchanged.
      - **OpenSpec mode — execute:** Confirm `openspec/changes/<slug>/` exists and every **Depends on** slug in that package's Apply status is DONE (archived, Status DONE, or all `tasks.md` `[x]`). Invoke **apply-code-changes**. Advisor reviews apply handoff — re-run verify criteria from `tasks.md`, check scope against `design.md`, never edit source. Write this package's Apply status (`DONE` or `BLOCKED`), not `plans/README.md`.
      - **OpenSpec mode — reconcile:** Walk `openspec/changes/` excluding `archive/`. Per change: refresh drifted `design.md`/`tasks.md`, verify DONE criteria on HEAD, update that package's Apply status. Report executable slugs.
      - **OpenSpec mode — --issues:** Publish issue body from `proposal.md` + pointer to change folder; write the URL into that package's Apply status **Issue** field. Same public-repo sensitivity gate as legacy.
