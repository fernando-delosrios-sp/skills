skill: grilling
description: Structured interactive rounds via structured-choices — preserve upstream frontier/fact-finding semantics

changes:
  - file: SKILL.md
    instructions: |
      Replace prose/emoji question presentation with structured-choices gates. Preserve upstream design-tree, frontier, round-dependency, fact-finding, and completion semantics unless they conflict with presentation.

      1. **Opening:** Replace "Interview the user relentlessly..." intro with: stress-test a plan, decision, or idea until shared understanding; map decisions as a design tree; work it in rounds.

      2. **Remove entirely:** The emoji prose question template block (❓ **Q1** ... ➡️ recommended answer). Remove "number each question and give your recommended answer" — replaced by structured gates.

      3. **Add sections** (writing-for-agents style, concise):

         ## Design tree
         Every decision branches into decisions that hang off it. The **frontier** is every decision whose prerequisites are settled — askable now without guessing at unsettled answers.

         ## Round loop
         1. Compute the frontier from settled answers.
         2. Present the whole frontier as one structured round (below). Halt until every question is answered.
         3. Record answers by option `id` (or custom input when used).
         4. Recompute — settled decisions push the frontier outward. A question whose answer depends on another still open in this round belongs to a later round, not this one.
         5. Repeat until the frontier is empty.

         ## Present a round
         Follow [structured-choices](../structured-choices/SKILL.md). One gate per round — never numbered prose lists.

         **Multi-question round:** one decision-tool call (e.g. Cursor `AskQuestion`) with a `questions` entry per frontier item. The user answers each in sequence within that single gate.

         Per question:
         - stable `id` for the decision (e.g. `auth-strategy`)
         - one-sentence `prompt`; context in option `detail` when needed
         - two or more concrete options; mark recommendation `(Recommended)` first
         - open branches — supply plausible options; host "Other" captures custom answers

         Do not duplicate options in prose after the tool call.

         ## Facts vs decisions
         Preserve upstream fact-finding: dispatch sub-agent for environment facts; running exploration is unsettled prerequisite; only downstream questions wait; decisions are the user's.

         ## Done
         Frontier empty and user confirms shared understanding (`confirm_dialog` gate per structured-choices). Do not act until confirmed. Preserve "every branch visited, nothing silently assumed."

      4. **Do not change** frontmatter name or description unless upstream description no longer matches behavior.
